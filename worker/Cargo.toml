[package]
name = "virling-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
askama = "0.16.1"
base64 = "0.22.1"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4", "js"] }
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
