[package]
name = "virling-site"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
askama = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "js"] }
worker = "0.8.7"

[profile.release]
opt-level = "s"
lto = true
