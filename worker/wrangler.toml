name = "virling-site"
main = "build/index.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "virling.com", custom_domain = true },
  { pattern = "www.virling.com", custom_domain = true },
]

[build]
command = "./build.sh"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"

[[kv_namespaces]]
binding = "WAITLIST"
id = "bf5404416e494ede813918d007d4bc4d"

[vars]
BASE_URL = "https://virling.com"
WAITLIST_FROM = "Rahul at Virling <hello@virling.com>"
# Shown as "Applications close {BETA_CLOSES}." on the landing pages, such as "November 15"; empty hides the line.
BETA_CLOSES = "November 8"

[[ratelimits]]
name = "PREORDER_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "EVENT_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Migrations in ./migrations are applied manually: npx wrangler d1 migrations apply virling-analytics --remote
[[d1_databases]]
binding = "DB"
database_name = "virling-analytics"
database_id = "9f0793f1-01ed-4176-828e-1aeb53d726cd"
migrations_dir = "migrations"
