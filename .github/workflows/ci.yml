name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bundled duckdb debug info fills the runner disk and crashes the linker.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check
        working-directory: worker
      - name: Tracker is built from source and at most 2,000 B gzipped
        run: |
          ./scripts/build-tracker.sh
          git diff --exit-code assets/v.js
          test "$(gzip -9c assets/v.js | wc -c)" -le 2000
      - run: node --test scripts/tracker.test.mjs

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.100
      - run: cargo nextest archive --archive-file tests.tar.zst
      # Cache storage, not artifacts: artifact downloads hit the account egress limit.
      - uses: actions/cache/save@v4
        with:
          path: tests.tar.zst
          key: tests-${{ github.run_id }}

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: rows
            expr: test(=index::rows::tests::rows_match_sql)
          - shard: reads
            expr: test(=index::tests::index_reads_match_sql)
          - shard: loads
            expr: test(=events::payment_tests::events_written_while_the_index_loads_count_once)
          - shard: order
            expr: test(=index::tests::index_follows_out_of_order_events)
          - shard: appends
            expr: test(=events::payment_tests::concurrent_appends_keep_touches_exact)
          - shard: goals
            expr: test(=index::goals::tests::goals_and_funnels_match_sql)
          - shard: mid
            expr: test(=events::payment_tests::removing_sample_data_leaves_real_rows_and_the_index_exact) | test(=index::retention::tests::retention_and_mrr_match_sql) | test(=index::tests::store_reads_use_the_index_and_follow_new_events) | test(=index::tests::setup_matches_sql)
          - shard: rest
            expr: not (test(=index::rows::tests::rows_match_sql) | test(=index::tests::index_reads_match_sql) | test(=events::payment_tests::events_written_while_the_index_loads_count_once) | test(=index::tests::index_follows_out_of_order_events) | test(=events::payment_tests::concurrent_appends_keep_touches_exact) | test(=index::goals::tests::goals_and_funnels_match_sql) | test(=events::payment_tests::removing_sample_data_leaves_real_rows_and_the_index_exact) | test(=index::retention::tests::retention_and_mrr_match_sql) | test(=index::tests::store_reads_use_the_index_and_follow_new_events) | test(=index::tests::setup_matches_sql))
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.100
      - uses: actions/cache/restore@v4
        with:
          path: tests.tar.zst
          key: tests-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: cargo nextest run --archive-file tests.tar.zst --workspace-remap . -E '${{ matrix.expr }}'

  server:
    if: always()
    needs: [clippy, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.clippy.result }}" = success && test "${{ needs.test.result }}" = success

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: worker
      - run: cargo test
        working-directory: worker
