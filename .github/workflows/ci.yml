name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bundled duckdb debug info fills the runner disk and crashes the linker.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check
        working-directory: worker
      - name: Tracker is built from source and at most 1,350 B gzipped
        run: |
          ./scripts/build-tracker.sh
          git diff --exit-code assets/v.js
          test "$(gzip -9c assets/v.js | wc -c)" -le 1350
      - run: node --test scripts/tracker.test.mjs

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: worker
      - run: cargo test
        working-directory: worker
