name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "assets/**"
      - "templates/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "migrations/**"
      - "scripts/install.sh"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://virling.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            worker

      # Rebuild the public demo from this commit so it always shows the current UI.
      - name: Regenerate the demo
        run: cargo run --release --locked -- demo worker/demo

      # No-op when the cached binary already matches this version.
      - name: Install worker-build
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.150.0"
          command: deploy

      - name: Smoke check
        run: |
          for url in https://virling.com/ https://virling.com/agency https://virling.com/demo/ https://virling.com/install.sh; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Submit changed pages to IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/indexnow.py --site https://virling.com --src assets --home selfhost --key-file assets/2a8f55835d6896d691cddc70332b11ee.txt --before "$BEFORE"

      - name: Resubmit the sitemap to Search Console
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: python3 scripts/gsc-sitemaps.py https://virling.com/sitemap.xml
