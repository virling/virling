name: ciwhy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  ciwhy:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: virling/ciwhy@v0
