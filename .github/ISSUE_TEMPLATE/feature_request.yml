name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you use or do instead today
