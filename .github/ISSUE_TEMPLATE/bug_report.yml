name: Bug report
description: Something is broken or wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `virling serve --app`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Virling version
      placeholder: v0.1.0, or a commit hash
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Virling
      options:
        - Hosted (virling.com)
        - Binary
        - Docker
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove keys, emails and other private data before pasting.
      render: shell
