<div class="rrow"><div class="rbar"><span class="vb" style="width:{{ "{:.1}"|format(r.vw) }}%"></span><span class="rb" style="width:{{ "{:.1}"|format(r.rw) }}%"></span>{% if !r.mono %}<span class="ri">{{ r.icon|safe }}</span>{% endif %}<span class="rt">{% if r.mono %}<span class="rp">{{ r.name }}</span>{% else %}<b>{{ r.name }}</b>{% endif %}<span class="rs">{{ r.sub }}</span></span></div><span class="n v">{{ r.visitors }}</span><span class="n r">{{ r.revenue }}</span><span class="n"><span class="pv"><span class="pvl">{{ r.per_visitor }}{% if !r.ratio.is_empty() %}<span class="badge {{ r.tone }}">{{ r.ratio }}</span>{% endif %}</span>{% if r.small %}<span class="ss">small sample</span>{% endif %}</span></span></div>
