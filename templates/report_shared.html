<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="{% if report.logo.is_empty() %}data:,{% else %}{{ report.logo }}{% endif %}">
<link rel="preload" href="/assets/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<title>{{ report.site }} weekly revenue report{% if !report.agency.is_empty() %} · {{ report.agency }}{% endif %}</title>
</head>
<body class="r2-page">
<div class="r2-wrap r2-bar noprint">
  <div class="menu-wrap r2-week" data-menu>
    <button class="r2-btn" type="button" aria-haspopup="true" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>{{ week }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="menu right" hidden>
      {% for w in weeks %}<a href="{{ w.href }}"{% if w.on %} aria-current="true"{% endif %}>{{ w.label }}</a>
      {% endfor %}
    </div>
  </div>
  <button class="r2-btn" type="button" data-print><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Download PDF</button>
</div>
<main class="r2-main">
{% include "_report.html" %}
</main>
<script src="/assets/app.js"></script>
</body>
</html>
