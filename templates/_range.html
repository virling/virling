<div class="menu-wrap range" data-menu>
  <button type="button" aria-haspopup="true" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>{{ range_label }}</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="menu right" hidden>
    {% for r in ranges %}
    <a href="{{ r.href }}"{% if r.on %} aria-current="true"{% endif %}>{{ r.label }}</a>
    {% endfor %}
  </div>
</div>
