<!doctype html>
<html lang="en">
<body style="margin:0;padding:32px 16px;background:#F6F6F3;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#0E1116">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E4E4DF;border-radius:16px">
<tr><td style="padding:40px">
<p style="margin:0 0 24px"><img src="https://virling.com/assets/email-logo.png" width="120" height="30" alt="Virling" style="display:block;border:0"></p>
<h1 style="margin:0 0 16px;font-size:26px;letter-spacing:-0.03em">{{ heading }}</h1>
{% for line in lines %}<p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#4B515C">{{ line }}</p>
{% endfor %}<p style="margin:8px 0 0"><a href="{{ link }}" style="display:inline-block;padding:14px 24px;border-radius:10px;background:#0E1116;color:#FFFFFF;font-size:16px;font-weight:600;text-decoration:none">{{ button }}</a></p>
</td></tr></table>
<p style="margin:16px 0 0;font-size:12px;color:#6B717C">Virling by Stacklance Infotech LLP</p>
</td></tr></table>
</body>
</html>
